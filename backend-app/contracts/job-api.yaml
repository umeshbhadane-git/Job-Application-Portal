
paths:
  /api/jobs/public:
    get:
      tags:
        - Public Jobs
      summary: Browse published jobs without authentication
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
          description: Search job titles, company names, and descriptions
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, salary-asc, salary-desc]
        - in: query
          name: location
          schema:
            type: string
            maxLength: 150
        - in: query
          name: employmentType
          schema:
            type: string
            enum: [full-time, part-time, contract, internship]
      responses:
        "200":
          description: Published, unexpired jobs fetched successfully
        "400":
          description: Invalid search filters

  /api/jobs/public/{id}:
    get:
      tags:
        - Public Jobs
      summary: Get a published, unexpired job without authentication
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job fetched successfully
        "404":
          description: Job not found or unavailable

  /api/jobs:
    post:
      tags:
        - Job Management
      summary: Create a new job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created successfully
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Recruiter access required

    get:
      tags:
        - Job Management
      summary: Get all jobs created by the logged-in recruiter
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, closed]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest]
      responses:
        "200":
          description: Jobs fetched successfully
        "401":
          description: Unauthorized
        "403":
          description: Recruiter access required

  /api/jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string

    get:
      tags:
        - Job Management
      summary: Get a single recruiter-owned job
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job fetched successfully
        "404":
          description: Job not found

    patch:
      tags:
        - Job Management
      summary: Update job details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "200":
          description: Job updated successfully
        "400":
          description: Validation failed
        "404":
          description: Job not found

    delete:
      tags:
        - Job Management
      summary: Delete a job
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job deleted successfully
        "404":
          description: Job not found

  /api/jobs/{id}/status:
    patch:
      tags:
        - Job Management
      summary: Change job status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, published, closed]
      responses:
        "200":
          description: Job status updated successfully
        "400":
          description: Invalid status
        "404":
          description: Job not found

components:
  schemas:
    JobInput:
      type: object
      required:
        - title
        - company
        - description
        - location
        - workplaceType
        - employmentType
        - experienceLevel
      properties:
        title:
          type: string
          example: Senior Java Developer
        company:
          type: string
          example: Tech Solutions
        description:
          type: string
          example: We are looking for a Java developer with strong backend development experience.
        location:
          type: string
          example: Pune, Maharashtra
        workplaceType:
          type: string
          enum: [onsite, remote, hybrid]
        employmentType:
          type: string
          enum: [full-time, part-time, contract, internship]
        experienceLevel:
          type: string
          enum: [entry, junior, mid, senior, lead]
        salary:
          type: object
          properties:
            min:
              type: number
              example: 500000
            max:
              type: number
              example: 900000
            currency:
              type: string
              example: INR
        skills:
          type: array
          items:
            type: string
          description: Required skills for the role
        optionalSkills:
          type: array
          items:
            type: string
          description: Preferred but non-mandatory skills
        closingDate:
          type: string
          format: date-time
          nullable: true
