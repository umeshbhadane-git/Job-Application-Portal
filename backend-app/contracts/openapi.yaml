openapi: 3.0.4

info:
  title: Job Portal API
  version: 1.0.0
  description: Authentication, authorization, and profile management API contract.

servers:
  - url: http://localhost:5000/api

tags:
  - name: Authentication
  - name: Profile

paths:
  /auth/register:
    $ref: './auth-api.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './auth-api.yaml#/paths/~1auth~1login'
  /auth/me:
    $ref: './auth-api.yaml#/paths/~1auth~1me'
  /profile/me:
    $ref: './profile-api.yaml#/paths/~1profile~1me'
  /users/me:
    $ref: './user-api.yaml#/paths/~1users~1me'
  /resumes:
    $ref: './resume-api.yaml#/paths/~1resumes'



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
