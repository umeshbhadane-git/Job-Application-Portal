
openapi: 3.0.4

info:
  title: Job Portal API - Resumes
  version: 1.0.0
  description: Resume upload, download, and deletion API.

servers:
  - url: http://localhost:5000/api

tags:
  - name: Resumes

paths:
  /resumes:
    post:
      tags: [Resumes]
      summary: Upload or replace the logged-in user's resume
      operationId: uploadResume
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '201':
          description: Resume uploaded successfully
        '400':
          description: Missing or invalid resume file
        '401':
          description: Authentication required
        '500':
          description: Internal server error

    get:
      tags: [Resumes]
      summary: Download the logged-in user's resume
      operationId: downloadResume
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resume file downloaded successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
        '404':
          description: No resume found
        '500':
          description: Internal server error

    delete:
      tags: [Resumes]
      summary: Delete the logged-in user's resume
      operationId: deleteResume
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resume deleted successfully
        '401':
          description: Authentication required
        '404':
          description: No resume found
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
